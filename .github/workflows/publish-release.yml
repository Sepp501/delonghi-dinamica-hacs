name: Publish Marketplace release

on:
  push:
    branches: [main]
    paths:
      - custom_components/delonghi_dinamica/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/delonghi_dinamica/manifest.json", encoding="utf-8"))["version"])')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish release (and tag) for Marketplace
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
