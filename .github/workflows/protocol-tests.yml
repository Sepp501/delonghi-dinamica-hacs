name: Validate Dinamica protocol

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integration Python files
        run: python -m compileall -q custom_components/delonghi_dinamica
      - name: Test read-only statistics and offline coffee draft
        run: python -m unittest discover -s tests -p 'test_*.py' -v
